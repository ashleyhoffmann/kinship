.gv-tbl table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }

.gv-stairs li::before { content: counter(st); position: absolute; left: 14px; top: 12px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--gv); color: #fff; font-family: var(--f-mono); font-size: 13px; }

            'Someone or something can *trigger* a feeling, but the emotion reflects your need. This keeps the power in our hands to self-regulate.'],
          ex: [['I feel cranky and frustrated at 5pm most weekdays.', 'Maybe unmet needs for food, rest, or autonomy to spend time meaningfully.'], ['I feel joyful and relieved when my child tells me why they’re angry.', 'Maybe a need is met for connection, hope, or understanding.']],
          remember: 'The feeling is the messenger; the need is the message.' },
        { id: 'accusations', title: 'Accusatory feelings', short: 'Focus on yourself in a vacuum, rather than implying another’s actions.',
          key: ['Some words sound like feelings but tell a story about someone else: *abandoned* means “you left me.”',
            'They point the finger outward, so the other person defends instead of listening, and you lose sight of your own need.',
            'The pain is real. Translate it to the feeling and need underneath.'],
          tool: 'translator', remember: 'A hidden “you did it”? Translate to feeling + need.' },
        { id: 'calm', title: 'De-escalation tools', short: 'Solo tools for when you’re on your own (or among strangers) and tensions are too high to think clearly, anger more than grief. Return to center first. The goal isn’t being right yet; it’s finding stillness, quiet and low energy again, so you can meet the need from a better place.',
          key: ['**Breathe slowly.** Long, slow exhales tell the body it’s safe. Don’t try to work out what’s “right” yet; just come back to center, to your inner calm.',
            '**Step away.** Change your surroundings for a while: go outside, or take a bath. A new place, temperature and air can interrupt the spiral. (If someone’s with you, say you’ll be back so leaving reads as care, not abandonment.)',
            '**Try physical touch.** Hug yourself, or ask someone you trust for a hug or a cuddle. Warm, steady touch can calm the body faster than words.',
            '**Find the humor.** Laughter breaks tension. Is there anything absurd here, or something funny you can let in?',
            '**Look for awe and gratitude.** Look up at the sky or a tree, or name a few things you’re thankful for. Feeling small in something big, or noticing what’s going right, makes room around the anger.',
            '**Take the high road.** You’re an adult, and you can handle this. Picture who you want to be and how you want to meet hardship and anger, then take one step as that person.',
            '**Weigh the consequences.** What happens if you stay in this feeling, and what happens if you rise above it? Look for the need underneath, and promise yourself you’ll do your best to meet it, or ask for help.',
            '**When all else fails, escape for a while.** It’s okay to step out of it on purpose: imagine a peaceful place, or the steady people you look up to (your pillars of maturity). The problem isn’t gone; you’re just in a better headspace to come back and tackle it, which beats escalating when the intensity has stopped being useful.',
            '**Afterwards, change things for next time.** Once you’re calm, look at what set it off: hunger, noise, clutter, a rushed morning, a recurring conversation. Small changes to your space and routines can stop the same storm from building again.'],
          ex: [['It’s late, I’m tired, I have an early morning, and the pile of dirty dishes is making me furious.', 'Breathe slowly until the heat drops. Then remember it’s a choice: do you *want* a clean sink tonight more than you want sleep? Maybe you choose ten minutes for just the pans, or choose sleep and a fresh start tomorrow. Either way, you’re choosing, not being forced.'], ['My shoe broke on the way to an interview I was already stressed about.', 'Pause for a few slow breaths, and find the humor if you can (of course it was today). Weigh it: will anyone remember the shoe? Find a quick fix or let it go, then walk in as the person you want to be.']],
          remember: 'Calm first, then the need. The problem will wait, and you’ll meet it better.' },
        { id: 'pain', title: 'Physical pain can signal emotions',
          short: 'Is it tissue damage, or a neuroplastic condition? Either way, it’s real pain, but not all bodily pains (especially chronic issues) indicate structural damage. Your brain may be trying to protect you, using the body’s pain language. (Read Dr. Howard Schubiner’s “Unlearn Your Pain” for more while I build out this unit.)',
          key: ['**Start with body needs.** Angry because you’re hungry? Snappy because you’re tired, cold or hurting? That irritability is valid: it’s pointing at food, rest, warmth or care, and meeting that need first often softens the rest.',
            '**The brain decides when to send pain.** Pain is the brain’s danger signal. Usually it protects injured tissue, but the brain can learn to keep sending pain after tissue heals, especially through stress, fear or hard emotions. That’s neuroplastic pain: just as real, and it can be unlearned.',
            '**Clues it may be neuroplastic:** it began in a stressful time or without a clear injury; it moves around or shows up in several places; it flares with stress, certain people or places, and fades when you’re absorbed in something; scans and tests don’t explain it. If possible, ask a doctor to rule out structural causes.',
            '**Fear turns the volume up.** Bracing against pain tells the brain there’s danger, which makes more pain. Safety, curiosity and kindness toward your body turn it down, and so can writing out what you feel (anger, grief, fear).',
            '**It’s all part of the puzzle.** Body needs, emotions and learned pain are all information about what’s going on inside of us, and how to make the world hurt less.'],
          remember: 'Real pain, many sources: bodily damage, emotions, and frequently-firing neural paths (neuroplastic “learned” pain).',
          src: 'Adapted from Howard Schubiner with Michael Betzold, <em>Unlearn Your Pain</em> (Mind Body Publishing). This is Kinship’s own short summary; if possible, ask a doctor to rule out structural causes.',
          opinion: 'Following the moon’s phases alongside your own cycle, especially for women, can be a gentle way to notice patterns in your energy, moods and body’s needs.',
          opinionSrc: 'Source: Helfrich-Förster et al., “Women temporarily synchronize their menstrual cycles with the luminance and gravimetric cycles of the Moon,” <em>Science Advances</em> 7 (2021). The evidence is still mixed, so treat it as something to notice, not a rule.' },
        { id: 'wheel', title: 'Feelings wheel', short: 'Spin to the feeling that fits, and see the universal needs it may be pointing to.', isTool: true,
          tool: 'wheel', remember: 'Name the feeling, then follow it to the need.' },
        { id: 'grief', title: 'Grief and despair', short: 'Despair is real. Nothing here “solves” grief; these are just tools I can offer for carrying it.',
          key: ['**Mourning is a need, too.** Grief is love for what’s gone, or for what never came, and mourning is on the list of universal needs: time, space and permission to miss what mattered. You can ask for that time the way you’d ask for rest.',
            '**Let it move.** Cry, write, walk, sing, or just sit with it. Feelings ask to be felt, and grief pushed down tends to come back heavier.',
            '**Let someone in.** Ask someone to sit with you without trying to fix it, and tell them that’s what you need. Being heard can lighten what words can’t change.',
            '**Tend the body on heavy days.** Water, food, sleep, sunlight, a warm bath, a hug. Some of the de-escalation tools in 1.3 may help too.',
            '**Remember on purpose.** Light a candle, visit a place, keep an object close, mark the day. Rituals give grief somewhere to go.',
            '**Ask for help when it’s too heavy.** If despair turns into not wanting to be here, please reach out to someone right now. In the US you can call or text 988, the Suicide & Crisis Lifeline.'],
          remember: 'Grieving is a need that wants to be heard as valid, not fought as a burden.' }
      ] },
    { id: 'need', course: 'emotions', num: 2, word: 'Identify the need', sub: 'the roots beneath', intro: 'Underneath every feeling is a universal need. Find it, and you have more than one way to meet it.',
      subs: [
        { id: 'universal', title: 'Universal needs', short: 'Food, safety, rest, freedom, belonging…',
          key: ['Every person shares the same needs. We may experience them at different times, in different ways.',
            'A need never names a person, place, object or time. That’s what makes it universal.',
            'Because we share them, we can recognise each other’s needs, even mid-conflict.'],
          tool: 'needs', remember: 'No who, where, what or when inside a need.' },
        { id: 'strategies', title: 'Needs vs. strategies', short: '“I need you to…” is a strategy. Find the need under it.',
          key: ['A strategy is one way to meet a need: a specific person, action, thing or time.',
            'One need has many strategies. Conflict happens when we cling to just one.',
            'If you got what you wanted, what would feel resolved inside you? What emotion do you seek?',
            'One person’s rational strategy to meet their need may look irrational to someone else.',
            'Seeing the need under your strategy brings a responsibility to choose differently to meet those needs.',
            'You may believe you have no choice (e.g. to pay rent, or be unhoused, or something else — and I hear you, let’s face our crummy options through upcoming units!). You may not like your choices, but it’s vital to remember your responsibility for your choices.'],
          tool: 'sorter', remember: 'Conflicts live between strategies. Needs never conflict.' },
        { id: 'identify', title: 'Identify a need', short: 'The inner tool: from a big feeling to the need underneath.', isTool: true,
          key: ['Start broad (sad, mad, scared) and narrow to the word that fits. “Mad” might be *frustrated* (needs ease), *resentful* (needs fairness) or *irritated* (needs rest).',
            'Ask where it’s coming from: your body, something someone did, something of yours, or too much at once.',
            'Land on the need, and let it matter before you solve anything.'],
          tool: 'finder', remember: 'Feeling → source → need.' }
      ] },
    { id: 'soil', course: 'emotions', num: 3, word: 'Who you are', sub: 'what’s going on down there', planned: true,
      intro: 'The soil beneath the roots: conscious awareness and choice, the egoic body that remembers, how mind and body shape pain, and your other mental faculties.',
      subs: [
        { id: 'chooser', title: 'Conscious awareness and choice', short: 'Present awareness makes choices, never as blame: “I have to go to work” becomes “I choose to, because I want a home and food.”', planned: true },
        { id: 'remembers', title: 'The egoic body that remembers', short: 'The feeling body carries memories and beliefs, and tries to protect you from pain it has known.', planned: true },
        { id: 'mindbody', title: 'Mind-body pain relationships', short: 'How mind and body talk about pain: memories, protection, and signals the brain learns to send.', planned: true },
        { id: 'tools', title: 'Other mental faculties', short: 'Imagination, memory, planning and mental math.', planned: true }
      ] },
    { id: 'request', course: 'relationships', num: 1, word: 'Request', sub: 'ask, don’t demand', intro: 'Once you know your need, say it out loud: kindly, clearly, and in a way the other person can say yes or no to.',
      subs: [
        { id: 'sharing', title: 'Sharing feelings and needs', short: 'What happened, how you feel, and what you need.',
          key: ['Start with what a camera would record: “The dishes have been in the sink since Tuesday,” not “you never help.” Swap *always* and *never* for what actually happened.',
            'Then your feeling and the need under it: “I feel tense, because I need order.”',
            'Own it: someone can trigger a feeling, but it comes from your need. That keeps the other person listening instead of defending.'],
          ex: [['“You’re always on your phone.”', '→ “You checked your phone three times during dinner. I felt lonely, because I need connection.”']],
          remember: 'Observation, feeling, need. Then ask.' },
        { id: 'requests', title: 'Not demands', short: 'Ask for something doable, and be ready to hear “no”.',
          key: ['A demand carries blame or punishment if refused. A request doesn’t.',
            'The test: how will I respond to a “no”? A “no” is a yes to another need. Get curious about which.',
            'Make it positive, specific and doable now: “Would you be willing to… tonight?”'],
          ex: [['“Stop leaving your stuff everywhere.”', '→ “When I see bags on the table, I feel tense, because I need order. Would you be willing to clear it before dinner?”']],
          remember: 'Ask for what you want, not what you don’t.' },
        { id: 'anticipating', title: 'Anticipating needs', short: 'Meet them the way you’d want to be met.',
          key: ['We share the same needs, so you can often guess theirs before they say a word: rest after a long shift, quiet before a big day, a snack before a hard talk.',
            'Look for strategies that meet everyone’s needs from the start, so nobody has to give anything up.',
            'Arrive with kindness and curiosity, not a case to argue. Your needs stay on the table too.'],
          remember: 'Same needs, so the same kindness.' }
      ] },
    { id: 'dialogue', course: 'relationships', num: 2, word: 'Dialogue', sub: 'meet both needs', intro: 'Listen as well as speak. Keep both sets of needs on the table until you find a strategy that meets them, then say thank you.',
      subs: [
        { id: 'ask', title: 'Ask if your strategy meets their needs', short: 'Check for a real yes, not a resentful one.',
          key: ['After you suggest a strategy, ask: “Would that work for you too?” Then listen for the need behind the answer.',
            'Guess their feeling and need out loud: “Are you feeling ___ because you need ___?” A guess, not a diagnosis. No fixing or advising yet.',
            'A yes given from guilt, duty or fear turns into resentment. Before saying yes yourself, check: is there a yes in me?'],
          remember: 'An honest “no” beats a resentful “yes”.' },
        { id: 'narrowing', title: 'Narrowing problem-solving', short: 'From many ideas to the one that meets every need.',
          key: ['Put both sets of needs side by side. Brainstorm lots of strategies, then narrow to the ones that meet every need on the table.',
            'Stuck? Go back to the needs, not to who’s right.',
            'Try it for a set time, check in, and close with thanks: what they did, how you feel, which need it met.'],
          ex: [['“Thanks for doing the dishes.”', '→ “When I saw the clean sink this morning, I felt relieved. I really needed that ease.”']],
          remember: 'Wide first, then narrow, then thanks.' },
        { id: 'communicate', title: 'Communicate', short: 'The interpersonal tool: two people, two sets of needs, one strategy for both.', isTool: true,
          key: ['Each person says what they feel, need and would like. The other says it back.',
            'Put both sets of needs side by side; they never conflict.',
            'Pick a strategy that meets both, try it, and close with thanks.'],
          tool: 'conflict', remember: 'When it’s stuck, go back to the needs.' }
      ] }
  ];

  /* ---------- Special applications (later: a second vertical tree beneath the first) ---------- */
  /* Special situations, in page order (the three animal groups first). Each opens as an accordion on #lens-relationships/special. */
  var APPS = [
    { id: 'family', name: 'Family animals', short: 'Companions who share our homes, routines and moods, and their emotional needs.', status: 'Soon', preview: true },
    { id: 'wild', name: 'Wild animals', short: 'Neighbors who live by their own rules: room, closed offers, urban wildlife and land left livable.', status: 'Soon', preview: true },
    { id: 'captive', name: 'Captive animals', short: 'Animals humans keep for use: farms, labs, shows. Respectful words, honest numbers, and peace with animals across Kinship.', status: 'Soon', preview: true },
    { id: 'children', name: 'Children', short: 'Togetherness instead of split labor; kids pitching in beside you.', status: 'Soon' },
    { id: 'neighbors', name: 'Neighbors', short: 'The people, plants and animals you share water, air, walls and streets with.', status: 'Soon', preview: true },
    { id: 'distress', name: 'People in distress', short: 'Meeting someone unhoused or struggling: respect, capacity, boundaries and who can help.', status: 'Soon', preview: true },
    { id: 'coops', name: 'Cooperatives', short: 'Workplaces and homes owned and run together, without extracting profit.', status: 'Soon', preview: true },
    { id: 'plants', name: 'Plants', short: 'A plant’s signals as needs; continues in Gardening.', status: 'Soon' },
    { id: 'groups', name: 'Gatherings & events', short: 'Hosting, rounds and agreements, conflict in a circle.', status: 'Soon' },
    { id: 'projects', name: 'Projects', short: 'A shared goal, roles by willingness, check-ins.', status: 'Later' },
    { id: 'power', name: 'Power & peace', short: 'Nonviolence, abolition, and power with instead of power over.', status: 'Later', preview: true }
  ];

  return { NEEDS: NEEDS, NEED_DEF: NEED_DEF, WHEEL: WHEEL, NUANCE: NUANCE, FAUX: FAUX, SORT: SORT, SOURCES: SOURCES, CONFLICT: CONFLICT, UNITS: UNITS, APPS: APPS };
})();

<script src="../rel.js"></script>
<script>
/* California governance lens (tier 1 Choices, Beta): a lens on what stops people, legally, from meeting basic needs, who decides over shared needs,
   and how to advocate in the systems we have (and outside them) for better ones. Starts with California water and criminalization;
   housing (who owns homes, including private equity) is next. Registers window.MN_LENS_VIEWS.governance. */
(function () {
  function mn() { return window.MN; }
  function ul(items) { return '<ul>' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'; }
  function sec(n, title, short, body) {
    return '<section class="gv-sec" id="gv-' + n + '"><div class="gv-sec-head"><span class="gv-n">' + n + '</span><div><h2>' + title + '</h2><p>' + short + '</p></div></div>' + body + '</section>';
  }

  var WHO = [
    ['Water rights and drinking-water rules', 'State Water Resources Control Board', 'Appointed by the Governor, confirmed by the state Senate', 'Public meetings with public comment; written comments on proposals'],
    ['State Water Project: aqueducts from the north to farms and Southern California', 'California Department of Water Resources', 'State agency under the Governor', 'The Governor, your state Assemblymember and Senator'],
    ['Central Valley Project: the federal dams and canals', 'US Bureau of Reclamation', 'Federal agency', 'Your members of Congress'],
    ['California’s share of the Colorado River', 'Negotiated among seven states and the federal government; local districts hold the shares', 'Mixed: federal, state and district boards', 'Members of Congress; district board meetings'],
    ['Your tap', 'Your city utility or water district (in San Francisco, the Public Utilities Commission)', 'An elected board, or a commission appointed by the city', 'Regular public meetings, usually monthly'],
    ['Groundwater', 'Local Groundwater Sustainability Agencies (since the 2014 groundwater law)', 'Boards drawn from local agencies', 'Their public meetings and plans'],
    ['Rates at private water companies', 'California Public Utilities Commission', 'Appointed by the Governor', 'Public participation hearings and comments'],
    ['Laws, budgets and water bonds', 'The Legislature, the Governor and voters', 'Elected', 'Your representatives; ballot measures']
  ];
  var STAIRS = [
    ['Notice and learn', 'Read your water report and the maps. Find the name of your water system, its board, and when it meets.', '#lens-water/testing/report', 'Water reports and maps'],
    ['Talk and make', 'Tell neighbors what you found. Art travels further than charts: a mural, a zine, a song, a photo of the dry well or the canal.', '#lens-relationships/neighbors', 'Neighbors'],
    ['Show up', 'Local boards must post agendas 72 hours before regular meetings (the Brown Act) and take public comment. Two minutes at a microphone is on the record.', '', ''],
    ['Ask in writing', 'Request records under the California Public Records Act: test results, contracts, who voted how. Write to whoever holds the decision (the table above).', '', ''],
    ['Reach representatives', 'State Assemblymember and Senator for water law; county supervisors for wells and land use; your water board; members of Congress for federal projects and the Colorado River.', '', ''],
    ['Organize together', 'Join or start a group. A building, a block or a valley asking together carries more weight than one person, and shares the work.', '#lens-relationships/dialogue', 'Dialogue'],
    ['Vote, run, and protest', 'Water board seats are elected, often with few votes cast. Ballot measures decide water bonds. Protest makes a need visible when other doors stay shut.', '#lens-relationships', 'Relationships']
  ];

  /* Lovernance (envisioned alternatives): two models to build toward. Each law row starts with a word (Helps, In the way, County by county, Federal, Not yet law), never colour alone. */
  function law(rows) {
    return '<ul class="gv-law">' + rows.map(function (r) { return '<li><span class="gv-tag">' + r[0] + '</span> ' + r[1] + '</li>'; }).join('') + '</ul>';
  }
  function vision(n, name, short, lead, needs, rows) {
    return '<article class="gv-vision" aria-labelledby="gv-v' + n + '"><span class="eyebrow">Vision ' + n + '</span><h3 id="gv-v' + n + '">' + name + '</h3>' +
      '<p class="gv-vshort">' + short + '</p><p>' + lead + '</p>' +
      '<h4>How needs get met</h4>' + ul(needs) +
      '<h4>California today</h4>' + law(rows) + '</article>';
  }
  var COMMONS = vision(1, 'The Commons', 'Land shared and tended together.',
    'A front door anyone can walk through, especially people with nowhere else to go. It isn’t a separate place for poor people; it’s a commons open to all, the same way everyone sees the same table of water sources.',
    ['<b>Day one:</b> a bed, water and food. Rest comes first, and nobody is asked to work at the door.',
     '<b>The land</b> is held by a community land trust, which pays the land fee for everyone. Members give time instead of money.',
     '<b>The people who use the land make its rules.</b> Problems get small responses first, and conflicts are worked through close to home, with <a href="#lens-relationships/dialogue">Dialogue</a>. These come from Elinor Ostrom’s design principles for commons.',
     '<b>Worker co-ops</b> meet what’s hard to make alone: natural-fiber clothing, repair and tool libraries, tools, solar, internet and seed.',
     '<b>Anyone can leave,</b> and they leave with their skills and credit for what they gave.'],
    [['Helps', '<i>City of Santa Barbara v. Adamson</i> (California Supreme Court, 1980): the state constitution’s right to privacy struck down a city rule capping how many unrelated people could share a house.'],
     ['Helps', 'County assessors must consider a land trust’s resale limits when they value its homes, which keeps property tax lower (Revenue and Taxation Code §402.1).'],
     ['Helps', 'The Williamson Act (1965): farmland under a rolling 10-year contract is taxed on its value as a farm, not its market price. Not every county still signs new contracts.'],
     ['Helps', 'The Rainwater Capture Act of 2012: rain caught from a roof can be used without a water right.'],
     ['County by county', 'Class K (Title 25 of the California Code of Regulations, limited-density owner-built rural dwellings) lets people build simpler homes for themselves on rural land, but only in counties that have adopted it. Shelter, safe-parking and camping rules change by county and city too.'],
     ['In the way', 'Zoning that limits homes on rural land, building codes written for contractors, land prices, and, since <i>Grants Pass</i> (2024), citations for people sleeping outside while they look for a place.']])
  var LOVE = vision(2, 'Private lovernance', 'Land you hold yourself, governed by care instead of profit.',
    'You’re safe on your land for as long as you live there and look after it, and it can pass to your kin. What it can’t be is held empty to sell high later.',
    ['<b>One land fee,</b> charged on the value of the land, not the home on it, so building or fixing a home never raises the bill. This is Henry George’s land value tax.',
     '<b>Pay it in money or in time.</b> An hour volunteering at your child’s school, on a road crew or on fire watch counts the same as anyone else’s hour, like Edgar Cahn’s time banks.',
     '<b>Rentals become housing co-ops.</b> Residents own the building together on land-trust land. The monthly charge is the real cost (upkeep, the land fee, savings for repairs) with no profit on top, and resale prices are capped so homes stay affordable.',
     '<b>Landlords’ needs count too.</b> Underneath the rent is a need for safety and predictability, and often purpose. The co-op can pay a former landlord a lifetime income from monthly charges, they can keep a home in the building for life, or take a paid role caring for it.',
     '<b>Safety without hoarding.</b> Hoarding is one strategy for feeling safe. When health care, food and a home are reliably shared, it has less and less to do.'],
    [['In the way', 'Prop 13 (1978) caps property tax at 1% of a property’s value when it was last bought, with increases of no more than 2% a year. It taxes the land and the home together, and the longer someone holds, the less they pay. A land-value fee would need voters to change the state constitution.'],
     ['Helps', 'SB 1079 (2020): after a foreclosure auction of a home with 1 to 4 units, tenants, nonprofits, land trusts, limited-equity co-ops and public agencies get a window to make a matching offer.'],
     ['Helps', 'San Francisco’s Community Opportunity to Purchase Act (2019) gives qualified nonprofits the first chance to buy many rental buildings when they’re sold.'],
     ['Helps', 'The California Worker Cooperative Act (2015) made it simpler to form and fund worker-owned co-ops.'],
     ['Federal', 'A landlord who sells over time instead of all at once can spread the tax on the gain across those years (installment sales, 26 U.S.C. §453).'],
     ['Not yet law', 'Paying a land fee in time. Nothing in California does this yet, so it’s a door for advocacy (see Stairs for change below).']])

  function view() {
    var html =
      '<section class="gv-hero"><span class="gv-pill">Tier 1 · Choices · Beta</span><h1 tabindex="-1">California governance</h1>' +
      '<p class="gv-lede">California governance is one more lens on meeting needs: what helps or stops people, legally, from meeting their basic needs, and how to advocate for yourself in the systems we have while building better ones. Every shared need (water, air, land, a place to sleep) is governed by someone, often far from the people it touches. Some paths run through law; plenty don’t, like asking your church, a co-op or your block to meet a need directly. It starts with two visions of governance we can build, then gets into what the law currently is: the rights you hold just by existing, California water, and criminalization.</p>' +
      '<p class="gv-note"><b>California first.</b> State law comes first, federal law where it applies everywhere, and county or city rules are named when they change things, like shelters, camping and owner-built homes. Laws are explained here, not advised on: for your own situation, free legal aid and the California Courts Self-Help Guide (selfhelp.courts.ca.gov) can help.</p></section>' +

      sec(1, 'Lovernance', 'Envisioned alternatives: governance we can build, so the old way becomes obsolete.',
        '<p>A line often credited to Buckminster Fuller: “To change something, build a new model that makes the existing model obsolete.” Lovernance is governance rooted in love and kinship, and here are two models of it to build toward. Both start in the same place: the minimum isn’t what rent costs, it’s what it costs to meet needs directly. Rain caught on a tarp, seeds from a seed library and cuttings from a neighbor cost close to nothing (<a href="#lens-water/sources">Water: Sources</a>). The one thing that takes money is land, so that’s where governance comes in.</p>' +
        '<p>Both are built on kinship. Nobody charges their sister rent: what we give flows from relationship and need, and care reaches outward, from our household to neighbors and strangers, animals and plants included.</p>' +
        '<div class="gv-visions">' + COMMONS + LOVE + '</div>' +
        '<p class="gv-src">Sources: <i>City of Santa Barbara v. Adamson</i>, 27 Cal.3d 123 (1980); Cal. Rev. &amp; Tax. Code §402.1; California Land Conservation Act of 1965 (Williamson Act); Rainwater Capture Act of 2012; Cal. Code Regs. tit. 25, Limited Density Owner-Built Rural Dwellings; Cal. Const. art. XIII A (Prop 13); SB 1079 (2020); San Francisco Administrative Code ch. 41B (COPA); AB 816, California Worker Cooperative Act (2015); 26 U.S.C. §453; Elinor Ostrom, <i>Governing the Commons</i> (1990); Henry George, <i>Progress and Poverty</i> (1879); Edgar S. Cahn, <i>No More Throw-Away People</i> (2000).</p>') +

      '<div class="gv-turn"><span class="eyebrow">Back to today</span><h2>What the law currently is</h2>' +
      '<p>The rights, rules and decision-makers we live under now, and how to move them.</p></div>' +

      sec(2, 'Rights you have by existing', 'Technically, what you’re entitled to just by being a person here.',
        '<p>Both constitutions mostly protect people from the government, rather than promising what people need. Neither names a right to food, water or a home.</p>' +
        ul(['<b>US Constitution:</b> speech, religion, assembly and petitioning the government (1st Amendment); no unreasonable searches (4th); due process and equal protection of the laws (5th and 14th); no cruel and unusual punishment (8th). Most of these protect every person in the US, not only citizens.',
          '<b>California Constitution, Article I:</b> “All people are by nature free and independent and have inalienable rights. Among these are enjoying and defending life and liberty, acquiring, possessing, and protecting property, and pursuing and obtaining safety, happiness, and privacy.” It also protects speech, assembly, and your right to see government meetings and records (§3).',
          '<b>Water:</b> Article X, §2 of the state constitution says water must be put to reasonable, beneficial use, not wasted.']) +
        '<p class="gv-note"><b>Animals and land:</b> neither constitution gives rights to animals, rivers or land; in law they’re mostly property. California protects animals from cruelty (Penal Code §597) and some farm animals from the smallest cages (Prop 12, 2018). Ecuador’s constitution (2008) recognizes rights of nature.</p>' +
        '<p class="gv-src">Sources: US Constitution, Amendments 1, 4, 5, 8 and 14; California Constitution, art. I §§1–3 and art. X §2; Cal. Penal Code §597; Proposition 12 (2018); Constitution of Ecuador (2008), arts. 71–74.</p>') +

      sec(3, 'Two views, the same needs', 'Strategies differ by place; the needs underneath are shared.',
        '<div class="gv-views">' +
        '<div class="gv-view"><span class="eyebrow">In a big city</span><p>“I’d prefer to buy tap water than lug it out of some river myself. I wish it were healthier and cheaper, but I’ll happily pay for the convenience. I’m open to collecting rainwater for my plants.”</p><small>Needs: ease, health, time, accessibility</small></div>' +
        '<div class="gv-view"><span class="eyebrow">In rural California</span><p>“Why does big agriculture get water rights to supposedly provide for the collective, in a way that doesn’t allow me to provide for myself in my home, to grow my own food? The irrational red tape is frustrating.”</p><small>Needs: fairness, autonomy, food, empowerment</small></div>' +
        '</div><p>Both are reasonable. Conflicts live between strategies, never between needs, so good governance starts by asking what everyone needs and who is at the table.</p>') +

      sec(4, 'Who controls California’s water', 'Each decision has a holder, a way they’re chosen, and a door to knock on.',
        '<div class="gv-tbl"><table><thead><tr><th>Decision</th><th>Who holds it</th><th>How they’re chosen</th><th>How to reach them</th></tr></thead><tbody>' +
        WHO.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div>' +
        '<p class="gv-note"><b>Worth knowing:</b> some agricultural water districts give votes by land owned rather than one person, one vote, a system the US Supreme Court upheld in 1973. The biggest landowners can hold the most votes.</p>') +

      sec(5, 'Where the water goes', 'In an average year, across the whole state.',
        '<div class="gv-split"><div style="--w:50%"><b>About 50%</b><span>Environment: rivers, wetlands, the Delta</span></div><div style="--w:40%"><b>About 40%</b><span>Farms</span></div><div style="--w:10%"><b>About 10%</b><span>Cities and homes</span></div></div>' +
        '<p>Of farm water, about 27% grows feed for animals: alfalfa, irrigated pasture and silage corn. Wet years and dry years shift these numbers a lot; in droughts, rivers lose the most.</p>' +
        '<p class="gv-src">Source: Public Policy Institute of California. Water per pound of each food is in <a href="#lens-water/sources/take">the end of Water: Sources</a>.</p>') +

      '<aside class="gv-fun"><span class="eyebrow">Fun fact</span><p>California law (2012) recognizes a human right to safe, clean, affordable water. Rights on paper become rights in practice when people keep asking.</p></aside>' +

      sec(6, 'Criminalization and incarceration', 'When meeting a need becomes a crime.',
        '<p>Sleeping, sitting, camping, parking overnight, washing up: these are ways people meet the needs for rest, shelter and cleanliness. In many cities they’re against the law in public, which falls hardest on people who have nowhere private to do them.</p>' +
        ul(['<b>Since <i>City of Grants Pass v. Johnson</i></b> (US Supreme Court, 2024), cities can enforce bans on sleeping and camping outside even when there are no shelter beds. That July, California’s Governor ordered state agencies to clear encampments and urged cities to do the same.',
          '<b>Fines grow.</b> A ticket someone can’t pay can become a warrant, a suspended license or jail time, and a record makes housing and work harder to find, which makes the next ticket more likely.',
          '<b>Incarceration at scale.</b> The US holds about 1.9 million people in prisons, jails and detention, one of the highest rates in the world. California’s state prisons hold about 90,000.',
          '<b>Voters have moved both ways.</b> Prop 47 (2014) reduced some drug and theft felonies to misdemeanors; Prop 36 (2024) raised penalties for some of them again. Prop 6 (2024), which would have ended forced labor as a punishment in the state constitution, did not pass.',
          '<b>Other strategies being tried:</b> diversion to treatment instead of jail, restorative justice circles, and crisis teams of medics and counselors instead of police for mental health calls (CAHOOTS in Eugene, Oregon, since 1989; San Francisco’s Street Crisis Response Team).']) +
        '<p class="gv-note"><b>Two questions for any rule like this:</b> What need was the person meeting? Does the rule offer another way to meet it?</p>' +
        '<p>More in <a href="#lens-relationships/special/distress">Relationships: People in distress</a> and <a href="#lens-relationships/special/power">Power &amp; peace</a>.</p>' +
        '<p class="gv-src">Sources: <i>City of Grants Pass v. Johnson</i>, 603 U.S. (2024); California Executive Order N-1-24 (2024); Prison Policy Initiative, <i>Mass Incarceration: The Whole Pie</i> (2024); California Department of Corrections and Rehabilitation population reports; California Secretary of State, statements of vote (2014, 2024).</p>') +

      sec(7, 'Stairs for change', 'Start on the first step. Each one makes the next easier.',
        '<ol class="gv-stairs">' + STAIRS.map(function (s, i) {
          return '<li style="--i:' + i + '"><b>' + s[0] + '</b><p>' + s[1] + '</p>' + (s[2] ? '<a href="' + s[2] + '">' + s[3] + ' →</a>' : '') + '</li>';
        }).join('') + '</ol>' +
        '<p class="gv-src">Find your state representatives at findyourrep.legislature.ca.gov.</p>') +

      sec(8, 'Paths outside law', 'Not every change waits on a vote.',
        '<p>Advocating for yourself can mean asking the people and places already around you to meet a need directly, and leaving law out of it.</p>' +
        ul(['<b>Your church, temple, mosque or synagogue:</b> a parking lot opened for safe overnight parking, showers or a kitchen shared, land offered for homes. Since 2024, California lets faith groups build affordable housing on land they own without a rezoning fight (SB 4).',
          '<b>Your building or block:</b> a tenants’ association, a shared tool shelf, a meal train.',
          '<b>Co-ops and land trusts:</b> homes and workplaces owned by the people who use them (<a href="#lens-relationships/special/coops">Cooperatives</a>).',
          '<b>Mutual aid:</b> neighbors meeting neighbors’ needs directly, no application required.']) +
        '<p class="gv-src">Sources: California SB 4, Affordable Housing on Faith and Higher Education Lands Act of 2023.</p>') +

      sec(9, 'A transparency checklist', 'Questions to ask about any decision over a shared need.',
        ul(['Who made this decision, and who could have?', 'Who benefits, and who pays?', 'Who was at the table, and who wasn’t?', 'Where is the data, and can anyone read it?', 'When is the next chance to weigh in?'])) +

      '<p class="gv-note"><b>Coming next · Housing:</b> who owns homes, including private equity firms that buy houses to rent out, and the paths from rentals to co-ops.</p>';
    return { title: 'California governance · Kinship', html: mn().header('home') + '<div><a class="back" href="#">← Education</a></div><main class="gv">' + html + '</main>' + mn().footer() };
  }

  window.MN_LENS_VIEWS = window.MN_LENS_VIEWS || {};
  window.MN_LENS_VIEWS.governance = function () { return view(); };
})();

</script>
<script>
/* Kinship: home, lens pages and profile. Plain JS, no build step.
   Routes (hash): '' home · 'plans' · 'favorites' · 'tools' · 'profile' · 'lens-<id>[/<sub>]'. A lens with a course registers
   window.MN_LENS_VIEWS[id](sub, lens) → { html, title } (see rel.js).
   The profile is saved only in this browser (localStorage). */
(function () {
  'use strict';

  var TIERS = window.MN_TIERS || [];
  var LENS = {};
  TIERS.forEach(function (t) { t.lenses.forEach(function (l) { l.tier = t; LENS[l.id] = l; }); });
  var COUNT = Object.keys(LENS).length;

  /* 'ready' shows as Beta: usable now, still growing. Soonest is the next lens to be written; Last is the final stretch. */
  var STATUS = { ready: 'Beta', building: 'In progress', soonest: 'Soonest', next: 'Next', soon: 'Soon', later: 'Later', last: 'Last' };
  var STATUS_NOTE = {
    ready: '',
    building: 'This lens is being written now.',
    soonest: 'This lens is the next one to be written.',
    next: 'This lens comes after the Roots lenses.',
    soon: 'This lens is coming soon.',
    later: 'This lens is planned for a later tier.',
    last: 'This lens is planned for the last stretch.'
  };
  var BETA = Object.keys(LENS).filter(function (id) { return LENS[id].status === 'ready'; }).length;

  /* Personalization (the Profile, the Personalize card, "For you" tailoring) is hidden until it's ready.
     Flip PERSONALIZE to true to turn it on for everyone. To preview it in one browser, open the site with
     ?personalize=1 (and ?personalize=0 to hide it again); that choice is remembered in this browser only. */
  var PERSONALIZE = false;
  (function () {
    var PK = 'meeting-needs.personalize';
    try {
      var m = location.search.match(/[?&]personalize=([01])/);
      if (m) localStorage.setItem(PK, m[1]);
      if (localStorage.getItem(PK) === '1') PERSONALIZE = true;
      if (localStorage.getItem(PK) === '0') PERSONALIZE = false;
    } catch (e) { /* storage blocked: keep the default */ }
    document.documentElement.classList.toggle('me-off', !PERSONALIZE);
  })();

  var KEY = 'meeting-needs.profile.v1';
  var OPT = {
    /* Place questions ask what the place is and how long/how much you can shape it, not who owns it. */
    home: ['Apartment or room', 'House', 'Vehicle or boat', 'Shelter or no fixed place', 'Other'],
    stay: ['No fixed place right now', 'Under a year', 'A few years', 'Long-term, putting down roots', 'Not sure'],
    shape: ['Nothing: it all has to be portable', 'Small, removable things', 'Bigger changes, with an owner who’s on board', 'It’s ours to shape'],
    /* Water: where it comes from now, and how much each source carries you. 'notap' is a plain fact, not a crisis flag. */
    sources: [
      { id: 'notap', label: 'No safe tap water at home', hint: 'none, or not safe to drink', single: true },
      { id: 'tap', label: 'Safe tap water at home' },
      { id: 'refill', label: 'Public refill points' },
      { id: 'bottled', label: 'Bottled or delivered water' },
      { id: 'well', label: 'Private well' },
      { id: 'spring', label: 'Spring' },
      { id: 'rain', label: 'Rain catchment' },
      { id: 'wild', label: 'Creeks, rivers or lakes' }
    ],
    levels: ['Sometimes', 'Often', 'Main source'],
    filters: ['Pitcher filter', 'Faucet filter', 'Countertop reverse osmosis (like AquaTru)', 'Under-sink filter', 'Under-sink reverse osmosis', 'Whole-house filter', 'Gravity filter', 'Squeeze or backpacking filter', 'UV purifier', 'Water softener', 'None yet'],
    pipes: ['Before 1986 (older pipes)', '1986 or later', 'Not sure'],
    rain: ['Rarely (desert or long droughts)', 'Mostly one season (like most of California)', 'Through much of the year'],
    /* Food: how you can cook and keep food cold right now. */
    kitchen: ['A full kitchen', 'A hot plate, rice cooker or microwave', 'A shared kitchen', 'No way to cook right now'],
    cold: ['Fridge and freezer', 'A small or shared fridge', 'A cooler, or no fridge'],
    /* Air: what cooks the food, and where the kitchen air goes (Air course). */
    stove: ['Gas', 'Electric (coil or smooth top)', 'Induction', 'Hot plate or countertop only', 'No stove'],
    hood: ['Vents outside', 'Recirculates (no duct)', 'No hood or fan', 'Not sure'],
    /* Surroundings: what the building and the neighborhood bring (Poisons course). */
    built: ['Before 1978', '1978 or later', 'Not sure'],
    near: ['A freeway or busy road', 'Factory, refinery or oil and gas wells', 'Farm fields', 'An airport', 'None of these'],
    /* Cleaning: what the counters are made of (stone changes the vinegar advice) and where the wash gets done (Cleaning course). */
    counter: ['Laminate or plastic', 'Sealed granite or quartz', 'Marble, limestone or travertine', 'Wood or butcher block', 'Tile and grout', 'Stainless steel', 'Concrete', 'Not sure'],
    laundry: ['Machine at home', 'Shared machines in the building', 'Laundromat', 'By hand', 'A mix of these'],
    space: ['Windowsill', 'Balcony', 'Shared yard', 'Private yard', 'Community plot', 'Acreage or farmland', 'None yet'],
    consider: ['Asthma', 'Allergies', 'Pregnancy', 'Babies or toddlers', 'Chronic illness', 'Limited mobility'],
    hours: ['Under 1', '1 to 3', '3 to 6', 'More than 6'],
    budget: ['Free fixes only', 'Tight', 'Some room'],
    priorities: [
      { id: 'water', label: 'Not sure my water is safe', lens: 'water' },
      { id: 'pans', label: 'Nonstick pans and plastic', lens: 'toxins' },
      { id: 'stains', label: 'Clothes ruined by stains', lens: 'cleaning' },
      { id: 'grow', label: 'Want to grow food', lens: 'gardening' },
      { id: 'damp', label: 'Stuffy, damp rooms', lens: 'air' },
      { id: 'tension', label: 'Tension at home', lens: 'relationships' },
      { id: 'products', label: 'Too many products under the sink', lens: 'household-tools' },
      { id: 'broken', label: 'Things break and get tossed', lens: 'repair' }
    ]
  };
  var CONSIDER_LENS = {
    'Asthma': ['air', 'toxins'], 'Allergies': ['air', 'cleaning'], 'Pregnancy': ['toxins', 'water'],
    'Babies or toddlers': ['toxins', 'water'], 'Chronic illness': ['toxins', 'food'], 'Limited mobility': ['relationships']
  };
  var MAX_PRIORITIES = 3;

  /* Favorites: starred sub-units, stored as 'lensId:index' in this browser. */
  var FAV_KEY = 'meeting-needs.favorites.v1';
  var favs = (function () {
    try { var a = JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); if (Array.isArray(a)) return a.map(String); } catch (e) {}
    return [];
  })();
  function isFav(k) { return favs.indexOf(k) !== -1; }
  function toggleFav(k) {
    var i = favs.indexOf(k);
    if (i === -1) favs.push(k); else favs.splice(i, 1);
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) { toast('Couldn’t save: this browser is blocking site storage'); }
    return i === -1;
  }
  var STAR = '<svg width="20" height="20" viewBox="0 0 24 24" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';
  function starBtn(k, label) {
    var on = isFav(k);
    return '<button type="button" class="star" data-fav="' + esc(k) + '" aria-pressed="' + on + '" aria-label="Star: ' + esc(label) + '">' + STAR + '</button>';
  }

  function blank() {
    return { address: '', zone: '', home: '', stay: '', shape: '', space: [], sources: {}, filters: [], pipes: '', rain: '', kitchen: '', cold: '', stove: '', hood: '', built: '', near: [], counter: '', laundry: '', adults: '', kids: '', pets: '', consider: [], hours: '', budget: '', priorities: [] };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) { /* storage blocked or bad data */ }
    return blank();
  }
  function normalize(obj) {
    var p = blank();
    if (!obj || typeof obj !== 'object') return p;
    Object.keys(p).forEach(function (k) {
      if (Array.isArray(p[k])) p[k] = Array.isArray(obj[k]) ? obj[k].map(String) : [];
      else if (k === 'sources') {
        var src = obj.sources && typeof obj.sources === 'object' ? obj.sources : {};
        OPT.sources.forEach(function (o) { if (src[o.id]) p.sources[o.id] = String(src[o.id]); });
      }
      else if (obj[k] != null) p[k] = String(obj[k]);
    });
    /* Older profiles stored tenure in 'home'; keep the kind of place, drop the tenure. */
    var OLD_HOME = { 'Renting an apartment': 'Apartment or room', 'Renting a house': 'House', 'Own a house': 'House', 'Shared or co-op housing': 'Apartment or room' };
    if (OLD_HOME[p.home]) p.home = OLD_HOME[p.home];
    /* 'Land or farm' was a kind of place; land is now outdoor space, so the house and the land are separate answers. */
    if (p.home === 'Land or farm') { p.home = 'House'; if (p.space.indexOf('Acreage or farmland') === -1) p.space.push('Acreage or farmland'); }
    /* The old single 'water' answer becomes a main source. */
    var OLD_WATER = { 'City tap': 'tap', 'Private well': 'well', 'Spring': 'spring', 'Rain catchment': 'rain', 'Hauled or delivered': 'bottled', 'Public refill points': 'refill' };
    if (obj.water && OLD_WATER[obj.water] && !Object.keys(p.sources).length) p.sources[OLD_WATER[obj.water]] = 'Main source';
    return p;
  }
  var profile = load();
  var saveTimer = null;
  function save(quiet) {
    try {
      localStorage.setItem(KEY, JSON.stringify(profile));
      if (!quiet) toast('Saved on this device');
    } catch (e) {
      toast('Couldn’t save: this browser is blocking site storage');
    }
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { save(); }, 500); }
  function isEmpty(p) {
    return !p.home && !p.stay && !p.shape && !p.rain && !p.pipes && !p.kitchen && !p.cold && !p.stove && !p.hood && !p.built && !p.near.length && !p.counter && !p.laundry && !Object.keys(p.sources).length && !p.filters.length && !p.zone && !p.address && !p.adults && !p.kids && !p.pets && !p.hours && !p.budget &&
      !p.space.length && !p.consider.length && !p.priorities.length;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function plural(n, word) { n = Number(n); return n + ' ' + word + (n === 1 ? '' : 's'); }

  function suggestions(p) {
    var ids = [];
    p.priorities.forEach(function (pid) {
      var o = OPT.priorities.filter(function (x) { return x.id === pid; })[0];
      if (o) ids.push(o.lens);
    });
    p.consider.forEach(function (c) { (CONSIDER_LENS[c] || []).forEach(function (id) { ids.push(id); }); });
    var seen = {};
    return ids.filter(function (id) { if (seen[id] || !LENS[id]) return false; seen[id] = 1; return true; })
      .slice(0, 3).map(function (id) { return LENS[id]; });
  }
  function household(p) {
    var parts = [];
    if (p.adults !== '' && Number(p.adults) > 0) parts.push(plural(p.adults, 'adult'));
    if (p.kids !== '' && Number(p.kids) > 0) parts.push(Number(p.kids) === 1 ? '1 kid' : p.kids + ' kids');
    if (p.pets) parts.push(p.pets);
    return parts.join(' · ');
  }

  /* ---------- views ---------- */
  /* Logo: a cut-paper chain of hearts, draped in a gentle curve and joined at the sides, with dotted folds at the joins. Love as a practice, made by hand and linked. */
  var LOGO = (function () {
    var H = 'M12 21.2C7.4 18 3.3 14.6 2.4 10.9 1.6 7.5 3.8 4.6 6.9 4.6c2.1 0 3.6 1.2 5.1 3.1 1.5-1.9 3-3.1 5.1-3.1 3.1 0 5.3 2.9 4.5 6.3C20.7 14.6 16.6 18 12 21.2z';
    var hearts = ['translate(-19.45 -2.4) rotate(14.07)', '', 'translate(19.45 -2.4) rotate(-14.07)'].map(function (t) { return '<path d="' + H + '" transform="' + t + ' translate(-12 -12.9)"/>'; }).join('');
    return '<svg class="logo" width="69" height="26" viewBox="-32.74 -14.63 65.48 24.73" aria-hidden="true">' +
      '<g fill="#C2477F" stroke="#C2477F" stroke-width="3.2" stroke-linejoin="round">' + hearts + '</g>' +
      '<g fill="#FCEFF4" stroke="none">' + hearts + '</g>' +
      '<g fill="none" stroke="#C2477F" stroke-width="1" stroke-dasharray="1.4 1.6" stroke-linecap="round" opacity=".7">' +
      '<path d="M0 -3.5V-1.1" transform="translate(-9.73 -1.2) rotate(7.04)"/><path d="M0 -3.5V-1.1" transform="translate(9.73 -1.2) rotate(-7.04)"/></g>' +
      '</svg>';
  })();

  function header(active) {
    function link(href, label, key) {
      return '<a href="' + href + '"' + (active === key ? ' aria-current="page"' : '') + '>' + label + '</a>';
    }
    return '<header class="top glass">' +
      '<div class="top-left"><a class="brand" href="#">' + LOGO + '<b>Kinship</b></a>' +
      '<nav class="nav" aria-label="About">' + link('#about', 'About', 'about') + '</nav></div>' +
      '<nav class="nav" aria-label="Main">' +
      eduMenu(active === 'home') +
      plansMenu(active === 'plans') +
      link('#resources', 'Resources', 'resources') +
      link('#favorites', 'Favorites', 'favorites') +
      (PERSONALIZE ? '<a href="#profile" id="nav-profile"' + (active === 'profile' ? ' aria-current="page"' : (isEmpty(profile) ? ' class="me-nav"' : '')) + '>Profile</a>' : '') +
      '</nav></header>';
  }
  /* Education dropdown: hover (or keyboard focus) shows the tiers; hovering a tier opens its lenses to the left.
     Only ready lenses link; the rest are shown faded with their status. */
  function eduMenu(current) {
    var tiers = TIERS.map(function (t) {
      var items = t.lenses.map(function (l) {
        if (l.status === 'ready') return '<a class="nav-item" href="#lens-' + l.id + '">' + esc(l.name) + '</a>';
        if (LAZY[l.id]) return '<a class="nav-item" href="#lens-' + l.id + '">' + esc(l.name) + '<small>' + (STATUS[l.status] || '') + '</small></a>';
        return '<span class="nav-item is-off" aria-disabled="true">' + esc(l.name) + '<small>' + (STATUS[l.status] || '') + '</small></span>';
      }).join('');
      return '<div class="nav-tier" style="--tc:' + t.color + '" tabindex="0">' +
        '<span class="nav-tier-pill">' + t.num + '</span><span class="nav-tier-name">' + esc(t.name) + '</span>' +
        '<div class="nav-sub"><div class="nav-sub-in">' +
        '<span class="nav-sub-head">Tier ' + t.num + ' · ' + esc(t.name) + '</span>' + items + '</div></div></div>';
    }).join('');
    return '<div class="navdrop">' +
      '<a href="#"' + (current ? ' aria-current="page"' : '') + ' aria-haspopup="true">Education</a>' +
      '<div class="nav-menu"><div class="nav-menu-in">' + tiers + '</div></div></div>';
  }
  /* Plans dropdown: the same on every page. */
  var PLANS = [
    { id: 'education', name: 'Education plan', blurb: 'Your next most useful lessons' },
    { id: 'budget', name: 'Improvements & budget', blurb: 'What meeting needs costs, now and after upgrades' },
    { id: 'garden', name: 'Garden planner', blurb: '12 months, seed by seed' },
    { id: 'tools', name: 'My tools', blurb: 'Every course tool and list in one place', href: '#tools' }
  ];
  function plansMenu(current) {
    return '<div class="navdrop">' +
      '<a href="#plans"' + (current ? ' aria-current="page"' : '') + ' aria-haspopup="true">Plans</a>' +
      '<div class="nav-menu"><div class="nav-menu-in plans-in">' +
      PLANS.map(function (pl) { return '<a class="nav-item plan-item" href="' + (pl.href || '#plans/' + pl.id) + '"><b>' + esc(pl.name) + '</b><small>' + esc(pl.blurb) + '</small></a>'; }).join('') +
      '</div></div></div>';
  }
  /* Creator opinions: pink (tier 1 and logo color), set apart so the rest of the site reads as relatively objective. */
  function opinion(html, title) {
    return '<aside class="opinion"><span class="opinion-head"><span class="opinion-dot" aria-hidden="true"></span>' + (title ? esc(title) : 'Creator’s consideration') + '</span>' + html + '</aside>';
  }
  function footer() {

  function viewAbout() {
    return header('about') +
      '<section class="hero"><div class="hero-copy">' +
      '<span class="eyebrow">About</span>' +
      '<h1 class="hello" tabindex="-1">Hi, I’m Ashley. Based in San Francisco.</h1>' +
      '<p>Kinship is made from love: free and open source, aiming to clarify what we need to live and teach how to meet universal needs. (I don’t think “jobs” are needs; they’re strategies for money to meet true needs to thrive like water, safety, and love.)</p>' +
      '<p>In a way, this is my modern contribution to organized hippies. The San Francisco Diggers served free food in the Panhandle and ran free stores in the 1960s. Alicia Bay Laurel opened <i>Living on the Earth</i> (1970): “This book is for people who would rather chop wood than work behind a desk so they can pay P.G.&amp;E.”</p>' +
      '<p>The system isn’t working for so many people, and in my opinion we’ve lost touch with what actually meets our needs, putting too much trust in broken systems.</p>' +
      '<p>Kinship won’t solve these problems alone. It’s the clearest way I could package self-empowering information, for you to take and apply in your own life.</p>' +
      '<p>Most of Kinship aims to be plain, checkable information you can weigh for yourself.</p>' +
      '<p>The inspiring and helpful people whose work I’m amplifying and synthesizing are gathered under <a href="#resources">Resources</a>.</p>' +
      '<p>Feel free to email me at ' + mailto() + '. I’m just a law student trying to make the world a better place for free, so I honestly don’t have tons of capacity for requests, but if I can low-lift help you, or you have feedback or anything at all to share, I’m around!</p>' +

      '</fieldset>' +

      '<fieldset id="s-water" class="glass"><legend>Water</legend>' +
      '<div class="field"><span class="label" id="l-sources">Where your water comes from now <span class="hint">(tap how much each one carries you)</span></span>' +
      '<div class="srcs" role="group" aria-labelledby="l-sources">' + OPT.sources.map(srcRow).join('') + '</div></div>' +
      pickField('filters', 'Water filters you already have', OPT.filters, '(pick any)') +
      '<div class="row">' + selectField('pipes', 'When were your building’s pipes put in?', OPT.pipes, p.pipes) + selectField('rain', 'How often does rain or snow fall?', OPT.rain, p.rain) + '</div>' +
      '<p class="hint">These change rarely. When something does (say, you now have a safe tap), update it here and the Water course follows.</p>' +
      '</fieldset>' +

      '<fieldset id="s-food" class="glass"><legend>Food</legend>' +
      '<div class="row">' + selectField('kitchen', 'How can you cook right now?', OPT.kitchen, p.kitchen) + selectField('cold', 'How do you keep food cold?', OPT.cold, p.cold) + '</div>' +
      '<div class="row">' + selectField('stove', 'What do you cook on?', OPT.stove, p.stove) + selectField('hood', 'Kitchen fan', OPT.hood, p.hood) + '</div>' +
      '<p class="hint">The Food course opens the parts that fit: one-pot cooking, cold soaking, a small fridge or none. The Air course reads the stove and fan: gas flames and getting kitchen air out.</p>' +
      '</fieldset>' +

      '<fieldset id="s-toxins" class="glass"><legend>Surroundings</legend>' +
      '<div class="row">' + selectField('built', 'When was the building built?', OPT.built, p.built) + '</div>' +
      pickField('near', 'Close by, within about half a mile', OPT.near, '(pick any)') +
      '<p class="hint">Lead paint was banned for homes in 1978. With what’s nearby, the Poisons course opens the parts that fit: soil testing, filters, spray alerts.</p>' +
      '</fieldset>' +

      '<fieldset id="s-cleaning" class="glass"><legend>Cleaning</legend>' +
      '<div class="row">' + selectField('counter', 'Your kitchen counters', OPT.counter, p.counter) + selectField('laundry', 'Where you do laundry', OPT.laundry, p.laundry) + '</div>' +
      '<p class="hint">The Cleaning course reads both: marble, limestone and concrete skip vinegar, and shared machines or washing by hand open their own tips.</p>' +
      '</fieldset>' +

      '<fieldset id="s-household" class="glass"><legend>Household</legend>' +
      '<div class="row">' +
      textField('adults', 'Adults', p.adults, { type: 'number' }) +
      textField('kids', 'Kids', p.kids, { type: 'number' }) +
      textField('pets', 'Pets', p.pets, { placeholder: 'e.g. 1 cat' }) +
      '</div>' +
      pickField('consider', 'Anything to plan around?', OPT.consider, '(optional)') +
      '</fieldset>' +

      '<fieldset id="s-resources" class="glass"><legend>Time &amp; money</legend>' +
      '<div class="row">' + selectField('hours', 'Hours a week', OPT.hours, p.hours) + selectField('budget', 'Budget for swaps', OPT.budget, p.budget) + '</div>' +
      '</fieldset>' +

      '<fieldset id="s-priorities" class="glass"><legend>What bugs you most right now?</legend>' +
      pickField('priorities', 'Pick up to three', OPT.priorities, '<span id="pri-count">(' + p.priorities.length + ' of ' + MAX_PRIORITIES + ')</span>') +
      '</fieldset>' +

      '<div class="actions">' +
      '<div class="group"><button type="button" class="btn quiet" data-action="ask-clear">Clear profile</button></div>' +
      '<div class="group"><a class="btn" href="#">Done</a></div>' +
      '</div>' +
      '<div class="confirm" id="confirm-clear" hidden><span>Clear everything in your profile on this device?</span>' +
      '<button type="button" class="btn" data-action="clear">Clear it</button>' +
      '<button type="button" class="btn ghost" data-action="keep">Keep it</button></div>' +

      '<details class="backup glass"><summary>Back up or move to another device</summary><div class="inner">' +
      '<p class="hint">Your profile lives only in this browser. Copy the backup text and paste it into Kinship on another device or browser to restore it.</p>' +
      '<div class="group" style="display:flex;flex-wrap:wrap;gap:10px"><button type="button" class="btn ghost" data-action="copy">Copy backup</button>' +
      '<button type="button" class="btn ghost" data-action="restore">Restore from pasted text</button></div>' +
      '<label class="label" for="backup-text" style="font-size:14px;font-weight:600">Backup text</label>' +
      '<textarea id="backup-text" spellcheck="false" placeholder="Paste a backup here, or press Copy backup to fill it"></textarea>' +
      '</div></details>' +

      '</form></div>' + footer();
  }

  /* Shared pieces for lens modules (e.g. rel.js registers window.MN_LENS_VIEWS.relationships). */
  /* While personalization is hidden, courses see an empty profile, so nothing is tailored and no profile prompts show. */
  window.MN = { header: header, footer: footer, esc: esc, toast: function (m) { toast(m); }, lenses: LENS,
    profile: function () { return PERSONALIZE ? profile : blank(); }, options: OPT, opinion: opinion, deeper: deeper, credits: credits, personalize: PERSONALIZE };

  /* ---------- render + routing ---------- */
  var app = document.getElementById('app');
  var sky = '<div class="sky" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>';

  /* Course files load only when someone opens that lens, so the home page stays light. */
  var LAZY = { emotions: { css: 'rel.css', js: ['rel-data.js', 'rel.js'] }, relationships: { css: 'rel.css', js: ['rel-data.js', 'rel.js'] }, water: { css: 'water.css', js: ['water.js'] }, food: { css: 'food.css', js: ['food.js'] }, toxins: { css: 'tox.css', js: ['tox.js'] }, air: { css: 'air.css', js: ['air.js'] }, cleaning: { css: 'clean.css', js: ['clean.js'] }, 'emergency-prep': { css: 'em.css', js: ['em.js'] }, governance: { css: 'gov.css', js: ['gov.js'] } };
  var lazyState = {};
  function needsLazy(r) {
    var lid = r.indexOf('lens-') === 0 ? r.slice(5).split(/[\/?]/)[0] : '';
    var m = LAZY[lid];
    /* Emotions and Relationships share one file: once it has registered a view, don't load it again. */
    if (m && window.MN_LENS_VIEWS && window.MN_LENS_VIEWS[lid]) lazyState[lid] = 'done';
    if (!m || lazyState[lid] === 'done' || lazyState[lid] === 'failed') return false;
    if (lazyState[lid] !== 'loading') {
      lazyState[lid] = 'loading';
      var files = m.js.slice();
      var next = function () {
        if (!files.length) { lazyState[lid] = 'done'; route(); return; }
        var sc = document.createElement('script'); sc.src = '../' + files.shift();
        sc.onload = next;
        sc.onerror = function () { lazyState[lid] = 'failed'; route(); };
        document.body.appendChild(sc);
      };
      var link = document.createElement('link'); link.rel = 'stylesheet'; link.href = '../' + m.css;
      link.onload = next; link.onerror = next;
      document.head.appendChild(link);
    }
    return true;
  }

  var menuPicked = false;
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.nav-menu a')) menuPicked = true; }, true);

  function route() {
    var r = (location.hash || '').replace(/^#/, '');
    if (needsLazy(r)) return;
    var html, title = 'Kinship';
    var sec = '';
    if (!PERSONALIZE && (r === 'profile' || r.indexOf('profile/') === 0)) { html = viewHome(); }
    else if (r === 'profile' || r.indexOf('profile/') === 0) { html = viewProfile(); title = 'Profile · Kinship'; sec = 's-' + r.slice(8); }
    else if (r === 'about') { html = viewAbout(); title = 'About · Kinship'; }
    else if (r === 'resources') { html = viewResources(); title = 'Resources · Kinship'; }
    else if (r === 'plans' || r.indexOf('plans/') === 0) { html = viewPlans(); title = 'Plans · Kinship'; sec = 'plan-' + r.slice(6); }
    else if (r === 'favorites') { html = viewFavorites(); title = 'Favorites · Kinship'; }
    else if (r === 'tools') { html = viewTools(); title = 'My tools · Kinship'; }
    else if (r.indexOf('lens-') === 0 && LENS[r.slice(5).split(/[\/?]/)[0]]) {
      var lid = r.slice(5).split(/[\/?]/)[0], l = LENS[lid], custom = (window.MN_LENS_VIEWS || {})[lid];
      if (custom) { var v = custom(r.slice(5 + lid.length).replace(/^\//, ''), l); html = v.html; title = v.title; }
      else { html = viewLens(l); title = l.name + ' · Kinship'; }
    }
    else html = viewHome();
    app.innerHTML = sky + '<div class="wrap">' + html + '</div>';
    if (menuPicked) {
      menuPicked = false;
      app.querySelectorAll('.navdrop').forEach(function (dd) {
        dd.classList.add('is-closed'); dd.addEventListener('mouseleave', function () { dd.classList.remove('is-closed'); }, { once: true });
      });
    }
    document.title = title;
    requestAnimationFrame(placeArrow);
    window.scrollTo(0, 0);
    if (r) { var h = app.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
    var target = sec && document.getElementById(sec);
    if (target) target.scrollIntoView({ block: 'start' });
  }
  window.addEventListener('hashchange', route);

  /* Keep the tier dots in step with the sideways scroll (scroll doesn't bubble, so listen in capture). */
  var dotFrame = 0;
  app.addEventListener('scroll', function (e) {
    var g = e.target;
    if (!g.classList || !g.classList.contains('grid') || !g.closest('.tier')) return;
    cancelAnimationFrame(dotFrame);
    dotFrame = requestAnimationFrame(function () {
      var first = g.firstElementChild, dots = g.parentNode.querySelectorAll('.tier-dots i');
      if (!first || !dots.length) return;
      var step = first.getBoundingClientRect().width + (parseFloat(getComputedStyle(g).columnGap) || 0);
      var atEnd = g.scrollLeft + g.clientWidth >= g.scrollWidth - 2;
      var idx = atEnd ? dots.length - 1 : Math.round(g.scrollLeft / step);
      dots.forEach(function (d, i) { d.classList.toggle('on', i === idx); });
    });
  }, true);

  var toastEl = document.createElement('div');
  toastEl.className = 'toast'; toastEl.hidden = true; toastEl.setAttribute('role', 'status');
  document.body.appendChild(toastEl);
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.hidden = true; }, 1800);
  }

  function refreshSteps() {
    var nav = app.querySelector('.steps');
    if (nav) nav.outerHTML = stepsNav();
  }

  app.addEventListener('input', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-field');
    if (!f) return;
    profile[f] = e.target.value;
    refreshSteps();
    saveSoon();
  });
  app.addEventListener('change', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-field');
    if (!f || e.target.tagName !== 'SELECT') return;
    profile[f] = e.target.value; refreshSteps(); save();
  });
  app.addEventListener('submit', function (e) { e.preventDefault(); });

  app.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;

    var fav = b.getAttribute('data-fav');
    if (fav) {
      var on = toggleFav(fav);
      b.setAttribute('aria-pressed', String(on));
      toast(on ? 'Added to Favorites' : 'Removed from Favorites');
      return;
    }

    var srcId = b.getAttribute('data-src');
    if (srcId) {
      var lvl = b.getAttribute('data-lvl');
      if (profile.sources[srcId] === lvl) delete profile.sources[srcId];
      else {
        profile.sources[srcId] = lvl;
        if (srcId === 'notap') delete profile.sources.tap;
        if (srcId === 'tap') delete profile.sources.notap;
      }
      app.querySelectorAll('[data-src]').forEach(function (x) { x.setAttribute('aria-pressed', String(profile.sources[x.getAttribute('data-src')] === x.getAttribute('data-lvl'))); });
      refreshSteps(); save();
      return;
    }

    var pick = b.getAttribute('data-pick');
    if (pick) {
      var val = b.getAttribute('data-val');
      var list = profile[pick];
      var NONE = { filters: 'None yet', near: 'None of these' }[pick];
      if (NONE && list.indexOf(val) === -1) {
        /* 'None yet' and owning a filter (or 'None of these' and a neighbor) can't both be true. */
        var clear = val === NONE ? list.slice() : list.filter(function (x) { return x === NONE; });
        clear.forEach(function (x) {
          list.splice(list.indexOf(x), 1);
          app.querySelectorAll('[data-pick="' + pick + '"]').forEach(function (ob) { if (ob.getAttribute('data-val') === x) ob.setAttribute('aria-pressed', 'false'); });
        });
      }
      var i = list.indexOf(val);
      if (i !== -1) list.splice(i, 1);
      else {
        if (pick === 'priorities' && list.length >= MAX_PRIORITIES) { toast('Pick up to three. Unselect one first.'); return; }
        list.push(val);
      }
      b.setAttribute('aria-pressed', String(i === -1));
      if (pick === 'priorities') { var c = document.getElementById('pri-count'); if (c) c.textContent = '(' + list.length + ' of ' + MAX_PRIORITIES + ')'; }
      refreshSteps(); save();
      return;
    }

    var jump = b.getAttribute('data-jump');
    if (jump) {
      var sec = document.getElementById('s-' + jump);
      if (sec) { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); var first = sec.querySelector('input,select,button'); if (first) first.focus({ preventScroll: true }); }
      return;
    }

    var action = b.getAttribute('data-action');
    var box = document.getElementById('confirm-clear');
    var ta = document.getElementById('backup-text');
    if (action === 'ask-clear' && box) { box.hidden = false; }
    else if (action === 'keep' && box) { box.hidden = true; }
    else if (action === 'clear') { profile = blank(); save(true); toast('Profile cleared'); route(); }
    else if (action === 'copy' && ta) {
      ta.value = JSON.stringify({ app: 'meeting-needs', v: 1, profile: profile });
      var done = function () { toast('Backup copied'); };
      var fallback = function () { ta.focus(); ta.select(); toast('Backup is selected. Copy it with your keyboard.'); };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (err) { fallback(); }
    }
    else if (action === 'restore' && ta) {
      try {
        var data = JSON.parse(ta.value);
        var p = data && data.profile ? data.profile : data;
        if (!p || typeof p !== 'object') throw new Error('empty');
        profile = normalize(p); save(true); route(); toast('Profile restored');
      } catch (err) {
        toast('That text isn’t a Kinship backup. Copy it again and paste the whole thing.');
      }
    }
  });

  route();
})();

</script>
</body>
</html>
